[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sureshot"
version = "0.1.0"
description = "Static Rust vulnerability detection with an ML-calibrated confidence layer"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.0",
    "scikit-learn>=1.6",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "tree-sitter>=0.23",
    "tree-sitter-rust>=0.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
